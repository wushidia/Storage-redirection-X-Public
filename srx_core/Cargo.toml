[package]
name = "srx_core"
version = "1.2.57"
edition = "2024"

[lib]
name = "srx_core"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4.1"
once_cell = "1.21.4"
srx_hook = { git = "https://github.com/Kindness-Kismet/srx_hook.git", rev = "62c664109aea8aed5f7fe866683bddf8998ceace" }
srx_inline_hook = { git = "https://github.com/Kindness-Kismet/srx_inline_hook.git", rev = "e9abbd58e0c6ee459bb0f7724b896a70ece0a661" }
log = "0.4.34"
